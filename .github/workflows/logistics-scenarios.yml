name: Logistics scenario validation

on:
  push:
    branches: [main]
    paths: ['projects/logistics-scenarios/**', '.github/workflows/logistics-scenarios.yml']
  pull_request:
    paths: ['projects/logistics-scenarios/**', '.github/workflows/logistics-scenarios.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scenario-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build models
        run: python3 projects/logistics-scenarios/build_models.py
      - name: Check Python and independent SQL
        run: python3 -m unittest discover -s projects/logistics-scenarios/tests -v
      - name: Check dashboard logic
        run: node projects/logistics-scenarios/tests/dashboard_logic.cjs
